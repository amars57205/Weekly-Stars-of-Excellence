<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- كود الحماية المتقدم لتأمين الموقع ضد الاختراقات وثغرات السكربتات -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; script-src 'self' https://cdn.tailwindcss.com https://cdnjs.cloudflare.com 'unsafe-inline' 'unsafe-eval'; style-src 'self' https://fonts.googleapis.com https://cdnjs.cloudflare.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:; img-src 'self' https: data: blob:;">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    
    <title>لوحة نجوم التميز الأسبوعي - مدرسة عمار بن ياسر الابتدائية</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        school: {
                            50: '#f0fdf4',
                            600: '#059669',
                            700: '#047857',
                            900: '#065f46',
                        }
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; }

        /* حركة التمرير المستمرة من الأسفل إلى الأعلى للأقسام */
        @keyframes scrollUp {
            0% {
                transform: translateY(0);
            }
            100% {
                transform: translateY(-50%);
            }
        }

        .animate-ticker {
            display: flex;
            flex-direction: column;
            animation: scrollUp 25s linear infinite;
        }

        .ticker-wrapper:hover .animate-ticker {
            animation-play-state: paused; /* إيقاف مؤقت عند وضع الماوس لتمكين التفاعل */
        }
    </style>
</head>
<body class="text-gray-800 flex flex-col min-h-screen">

    <!-- Header -->
    <header class="bg-gradient-to-l from-school-900 to-school-700 text-white py-6 px-4 shadow-lg">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center space-x-3 space-x-reverse text-center md:text-right">
                <div class="bg-amber-400 text-school-900 w-14 h-14 rounded-2xl flex items-center justify-center shadow-md font-black text-2xl mx-auto md:mx-0">
                    <i class="fa-solid fa-award"></i>
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-black tracking-tight">نجوم التميز الأسبوعي</h1>
                    <p class="text-xs text-school-50 font-semibold">مدرسة عمار بن ياسر الابتدائية - الصفوف (الرابع، الخامس، السادس)</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="fetchStudents()" class="bg-white/20 hover:bg-white/30 text-white px-4 py-2 rounded-xl font-bold text-xs transition-all flex items-center gap-1.5 cursor-pointer">
                    <i class="fa-solid fa-rotate"></i>
                    <span>تحديث البيانات</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-10">

        <!-- أزرار الفلترة السريعة للصفوف المستهدفة -->
        <div class="flex items-center justify-center gap-2 overflow-x-auto pb-2">
            <button onclick="filterGrade('all')" class="grade-btn active px-5 py-2.5 rounded-xl font-bold text-sm bg-school-600 text-white shadow-sm transition-all cursor-pointer" data-grade="all">عرض كافة الصفوف</button>
            <button onclick="filterGrade('السادس')" class="grade-btn px-5 py-2.5 rounded-xl font-bold text-sm bg-white text-gray-600 border border-gray-200 hover:bg-gray-50 transition-all cursor-pointer" data-grade="السادس">الصف السادس</button>
            <button onclick="filterGrade('الخامس')" class="grade-btn px-5 py-2.5 rounded-xl font-bold text-sm bg-white text-gray-600 border border-gray-200 hover:bg-gray-50 transition-all cursor-pointer" data-grade="الخامس">الصف الخامس</button>
            <button onclick="filterGrade('الرابع')" class="grade-btn px-5 py-2.5 rounded-xl font-bold text-sm bg-white text-gray-600 border border-gray-200 hover:bg-gray-50 transition-all cursor-pointer" data-grade="الرابع">الصف الرابع</button>
        </div>

        <!-- حاوية عرض البيانات والأقسام -->
        <div id="contentContainer" class="space-y-12"></div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-100 py-6 text-center text-xs text-gray-500">
        جميع الحقوق محفوظة &copy; <span id="currentYear"></span> | إعداد وبرمجة أ. صلاح الرحيمان
    </footer>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyG3-yKJcrZIhFKnPp-SMtyT1JcmriWFl4iSo_THLdXXfqsV4tQxa7uoYEvgzM17nGJXw/exec';
        
        let students = [];
        let currentGradeFilter = 'all';

        window.onload = function() {
            document.getElementById('currentYear').innerText = new Date().getFullYear();
            fetchStudents();
            setInterval(fetchStudents, 20000);
        };

        async function fetchStudents() {
            try {
                let res = await fetch(SCRIPT_URL);
                let data = await res.json();
                if (Array.isArray(data)) {
                    students = data;
                }
                renderStudents();
            } catch(e) {
                console.error("خطأ في جلب بيانات الطلاب:", e);
                renderStudents();
            }
        }

        // دالة تنقية النصوص لمنع ثغرات XSS وحماية المدخلات
        function sanitizeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        function filterGrade(grade) {
            currentGradeFilter = grade;
            document.querySelectorAll('.grade-btn').forEach(btn => {
                if(btn.dataset.grade === grade) {
                    btn.className = "grade-btn active px-5 py-2.5 rounded-xl font-bold text-sm bg-school-600 text-white shadow-sm transition-all cursor-pointer";
                } else {
                    btn.className = "grade-btn px-5 py-2.5 rounded-xl font-bold text-sm bg-white text-gray-600 border border-gray-200 hover:bg-gray-50 transition-all cursor-pointer";
                }
            });
            renderStudents();
        }

        function renderStudents() {
            const container = document.getElementById('contentContainer');
            container.innerHTML = '';

            let targetGrades = currentGradeFilter === 'all' ? ['السادس', 'الخامس', 'الرابع'] : [currentGradeFilter];

            // إذا كان الخيار "عرض كافة الصفوف"، نقوم بلف الأقسام داخل حاوية ذات حركة تمرير مستمرة (Ticker) لضمان تكرار الحركة بسلاسة من الأسفل للأعلى
            if (currentGradeFilter === 'all') {
                const tickerWrapper = document.createElement('div');
                tickerWrapper.className = "ticker-wrapper overflow-hidden relative";
                tickerWrapper.style.maxHeight = "750px"; // تحكم بارتفاع النافذة المتحركة الظاهرة

                const tickerContainer = document.createElement('div');
                tickerContainer.className = "space-y-12 animate-ticker";

                // دمج القائمة مرتين لتحقيق حركة دائرية متصلة بلا انقطاع (Seamless Loop)
                const loopGrades = [...targetGrades, ...targetGrades];

                loopGrades.forEach(gradeName => {
                    const gradeStudents = students.filter(s => {
                        if (!s.grade) return false;
                        let g = String(s.grade).trim();
                        if (gradeName === 'السادس' && (g.includes('سادس') || g.includes('6') || g.includes('السادس'))) return true;
                        if (gradeName === 'الخامس' && (g.includes('خامس') || g.includes('5') || g.includes('الخامس'))) return true;
                        if (gradeName === 'الرابع' && (g.includes('رابع') || g.includes('4') || g.includes('الرابع'))) return true;
                        return g.includes(gradeName);
                    });
                    
                    const sectionHtml = createGradeSectionElement(gradeName, gradeStudents);
                    tickerContainer.appendChild(sectionHtml);
                });

                tickerWrapper.appendChild(tickerContainer);
                container.appendChild(tickerWrapper);
            } else {
                // العرض العادي في حال اختيار صف معين
                targetGrades.forEach(gradeName => {
                    const gradeStudents = students.filter(s => {
                        if (!s.grade) return false;
                        let g = String(s.grade).trim();
                        if (gradeName === 'السادس' && (g.includes('سادس') || g.includes('6') || g.includes('السادس'))) return true;
                        if (gradeName === 'الخامس' && (g.includes('خامس') || g.includes('5') || g.includes('الخامس'))) return true;
                        if (gradeName === 'الرابع' && (g.includes('رابع') || g.includes('4') || g.includes('الرابع'))) return true;
                        return g.includes(gradeName);
                    });
                    
                    const sectionHtml = createGradeSectionElement(gradeName, gradeStudents);
                    container.appendChild(sectionHtml);
                });
            }
        }

        function createGradeSectionElement(gradeName, gradeStudents) {
            const sectionDiv = document.createElement('div');
            sectionDiv.className = "space-y-4";

            sectionDiv.innerHTML = `
                <div class="flex items-center gap-3 border-b border-school-600/30 pb-3">
                    <div class="bg-school-600 text-white w-10 h-10 rounded-xl flex items-center justify-center font-bold text-base shadow-sm">
                        <i class="fa-solid fa-graduation-cap"></i>
                    </div>
                    <h2 class="text-xl font-extrabold text-school-900">طلاب الصف ${sanitizeHTML(gradeName)} المتميزون</h2>
                </div>
            `;

            const gridDiv = document.createElement('div');
            gridDiv.className = "grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6";

            if (gradeStudents.length > 0) {
                gradeStudents.forEach(s => {
                    const card = document.createElement('div');
                    card.className = "bg-white rounded-3xl border border-gray-100 shadow-sm hover:shadow-md transition-all duration-300 p-6 flex flex-col items-center text-center relative overflow-hidden group";

                    let driveId = s.driveId || '';
                    if (!driveId && s.imageUrl) {
                        let m = s.imageUrl.match(/id=([a-zA-Z0-9_-]+)/) || s.imageUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
                        if (m) driveId = m[1];
                    }

                    let initialSrc = driveId 
                        ? 'https://drive.google.com/thumbnail?id=' + driveId + '&sz=w1000'
                        : s.imageUrl;

                    const safeName = sanitizeHTML(s.studentName);
                    const safeGrade = sanitizeHTML(s.grade);
                    const safeReason = sanitizeHTML(s.reason || 'التميز والانضباط');

                    const avatar = initialSrc 
                        ? `<img src="${initialSrc}" class="w-full h-full object-cover" alt="${safeName}" onerror="switchImgServer(this, '${driveId}')">` 
                        : `<i class="fa-solid fa-user-graduate text-6xl text-school-600"></i>`;

                    card.innerHTML = `
                        <div class="absolute top-4 left-4 bg-amber-50 text-amber-700 px-3.5 py-1 rounded-xl text-xs font-bold border border-amber-200/60 shadow-xs">
                            ${safeGrade}
                        </div>
                        
                        <div class="w-44 h-44 rounded-3xl bg-school-50 border-4 border-amber-400 shadow-md flex items-center justify-center overflow-hidden mb-5 mt-6">
                            ${avatar}
                        </div>

                        <h3 class="font-extrabold text-gray-900 text-lg mb-3">${safeName}</h3>
                        
                        <div class="w-full bg-amber-50/70 border border-amber-100 rounded-2xl p-3.5 text-xs text-amber-900 font-semibold flex items-center gap-2 justify-between">
                            <span class="text-right truncate flex-1">سبب التكريم: ${safeReason}</span>
                            <i class="fa-solid fa-star text-amber-500 text-sm shrink-0"></i>
                        </div>
                    `;
                    gridDiv.appendChild(card);
                });
            } else {
                for (let i = 0; i < 2; i++) {
                    const emptyCard = document.createElement('div');
                    emptyCard.className = "bg-white/70 backdrop-blur-sm rounded-3xl border border-dashed border-gray-300 p-6 flex flex-col items-center text-center relative overflow-hidden opacity-75";
                    
                    emptyCard.innerHTML = `
                        <div class="absolute top-4 left-4 bg-gray-100 text-gray-500 px-3.5 py-1 rounded-xl text-xs font-bold border border-gray-200">
                            ${sanitizeHTML(gradeName)}
                        </div>
                        
                        <div class="w-44 h-44 rounded-3xl bg-gray-50 border-4 border-dashed border-gray-200 shadow-inner flex items-center justify-center overflow-hidden mb-5 mt-6 text-gray-300">
                            <i class="fa-solid fa-user-clock text-5xl"></i>
                        </div>

                        <h3 class="font-bold text-gray-400 text-lg mb-3">بانتظار رصد النجوم</h3>
                        
                        <div class="w-full bg-gray-50 border border-gray-200 rounded-2xl p-3.5 text-xs text-gray-400 font-medium flex items-center gap-2 justify-center">
                            <span>قريباً سيتم إضافة طلاب هذا الصف</span>
                        </div>
                    `;
                    gridDiv.appendChild(emptyCard);
                }
            }

            sectionDiv.appendChild(gridDiv);
            return sectionDiv;
        }

        function switchImgServer(img, id) {
            if (!id) {
                img.parentElement.innerHTML = '<i class="fa-solid fa-user-graduate text-6xl text-school-600"></i>';
                return;
            }
            if (!img.dataset.try) {
                img.dataset.try = "1";
                img.src = 'https://wsrv.nl/?url=https://drive.google.com/uc?id=' + id;
            } else if (img.dataset.try === "1") {
                img.dataset.try = "2";
                img.src = 'https://lh3.googleusercontent.com/d/' + id;
            } else {
                img.parentElement.innerHTML = '<i class="fa-solid fa-user-graduate text-6xl text-school-600"></i>';
            }
        }
    </script>
</body>
</html>
